# docker-compose.yml — E12-T01 (local proof): Go watcher + Redis in Docker.
# Per user request ONLY the Go plane is containerised: the Workers API shim
# (:8787, scripts/dev-server.mjs) and the dashboard (:3000) keep running on the
# host. On macOS host.docker.internal reaches the host's 8787 out of the box;
# on Linux (Hetzner deploy) add to go-watcher:
#   extra_hosts: ["host.docker.internal:host-gateway"]
services:
  redis:
    image: redis:7-alpine
    container_name: ta-redis
    # 2026-11-10: a Docker Desktop restart left ta-redis Exited(255) while
    # ta-go-watcher auto-restarted — the watcher then reported
    # redis_reachable=false and the Worker sat in DEGRADED for hours. Same
    # restart policy as go-watcher so a daemon bounce cannot orphan it.
    restart: unless-stopped
    # Host 6379 = an existing local redis, 6380 = vibesdk-redis → publish 6381.
    # Inside the compose network the watcher uses redis:6379 regardless.
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  # 2026-11-12 FAILOVER: Render (GO_WATCHER_URL origin) answers 429/challenge to
  # server-to-server fetches AND the venue 403s Cloudflare egress — so the only
  # working Toobit egress is this Mac's watcher (already the live heartbeat +
  # trigger-loop plane). This quick tunnel exposes it to the Worker for
  # /analyze, /strategies/registry and /api/market/*. CAVEAT: a quick tunnel
  # mints a NEW *.trycloudflare.com URL on every start — after any restart read
  # the URL from `docker logs ta-tunnel`, update GO_WATCHER_URL in BOTH
  # wrangler.toml files and re-deploy. Durable fix: a NAMED tunnel
  # (cloudflared tunnel login) or a recovered Render.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ta-tunnel
    # --protocol http2: this network throttles UDP (QUIC to the edge times out —
    # "failed to dial to edge with quic: timeout"), so the tunnel is pinned to
    # the TCP/HTTP2 transport. Without it the quick tunnel flaps and its
    # *.trycloudflare.com hostname stops resolving.
    command: tunnel --no-autoupdate --protocol http2 --url http://go-watcher:8080
    depends_on:
      - go-watcher
    restart: unless-stopped

  go-watcher:
    build: ./go-watcher
    container_name: ta-go-watcher
    environment:
      GO_PORT: "8080"
      REDIS_ADDR: redis:6379
      # E12-T01: heartbeat/cold-start target is the DEPLOYED Workers API
      # (https://trading-agent-control.mehranjannati.workers.dev — account
      # fa101008; re-deployed there 2026-10-14 after the Apjkala25 account
      # turned out to lack R2 at the account level, code 10042). The Mac keeps
      # pushing; Workers never dials the local Go plane.
      WORKERS_URL: https://trading-agent-control.mehranjannati.workers.dev
    ports:
      - "8080:8080"
    volumes:
      # Phase 1 dev affordance: live strategy registry edits without rebuild.
      # The image's /strategies copy is the deploy truth.
      - ./go-watcher/strategies/samples:/strategies:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped